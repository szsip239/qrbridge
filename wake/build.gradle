plugins {
    id 'com.android.application' version '9.4.0'
}

layout.buildDirectory = file('../.local/wake/build')

android {
    namespace = 'dev.qrbridge.wake'
    compileSdk = 36

    defaultConfig {
        applicationId = 'dev.qrbridge.wake'
        minSdk = 30
        targetSdk = 36
        versionCode = 2
        versionName = file('version.txt').text.trim()
    }

    signingConfigs {
        debug {
            storeFile = file('../.local/wake/debug.keystore')
            storePassword = 'android'
            keyAlias = 'androiddebugkey'
            keyPassword = 'android'
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_11
        targetCompatibility = JavaVersion.VERSION_11
    }
    packaging.resources.excludes += ['META-INF/versions/**', 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA']
}

dependencies {
    implementation 'com.github.osservatorionessuno:libadb-android-bc:3.5.1'
    implementation 'org.bouncycastle:bcpkix-jdk15to18:1.84'
    testImplementation 'junit:junit:4.13.2'
}
