name: check

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Python: uv runs the pinned ruff. PyPI, not GitHub releases, which returned 504s on 2026-11-08.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install uv==0.13.7
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      # A pull request checks out its merge into the target branch, whose tip is HEAD^1.
      - name: agent-check on the pushed or pull request range, with every test
        env:
          BASE: ${{ github.event_name == 'pull_request' && 'HEAD^1' || github.event.before }}
        run: |
          git cat-file -e "$BASE^{commit}" 2>/dev/null || BASE=$(git rev-parse HEAD~1)
          scripts/agent-check diff --base "$BASE" --all-checks
